<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة المدير — منصة مرمر</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#1a1d29; --muted:#6b7280;
    --line:#e5e7eb; --brand:#4f46e5; --brand2:#7c3aed;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --warn:#d97706;
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI","Noto Naskh Arabic","Tahoma",sans-serif;line-height:1.7;font-size:16px}
  header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
    padding:18px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  header h1{margin:0;font-size:1.3rem}
  header .sub{opacity:.9;font-size:.85rem}
  header .actions{display:flex;gap:8px;align-items:center}
  header button{background:rgba(255,255,255,.18);border:0;color:#fff;padding:9px 14px;
    border-radius:9px;cursor:pointer;font-family:inherit;font-size:.9rem}
  header button:hover{background:rgba(255,255,255,.3)}
  main{max-width:1050px;margin:0 auto;padding:22px}
  .num{unicode-bidi:plaintext;direction:ltr;display:inline-block}

  .pickbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .pickbar label{font-weight:600;color:var(--muted);font-size:.9rem}
  .pickbar select{padding:10px 14px;border:1px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:.95rem;background:#fff;min-width:200px}
  .backlink{color:var(--brand);cursor:pointer;font-size:.9rem;font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{color:var(--muted);font-size:.85rem;margin-bottom:6px}
  .stat .v{font-size:1.5rem;font-weight:700;color:var(--brand)}
  .stat .v small{font-size:.9rem;color:var(--muted);font-weight:500}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:22px}
  .panel h2{margin:0 0 16px;font-size:1.1rem;color:var(--ink);display:flex;align-items:center;gap:8px}

  .subj{margin-bottom:14px}
  .subj .row{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:5px}
  .subj .row .lbl{font-weight:600}
  .subj .row .val{color:var(--muted)}
  .track{position:relative;height:16px;background:#eef0f5;border-radius:8px;overflow:hidden}
  .track .open{position:absolute;inset-block:0;inset-inline-start:0;background:#c7d2fe;border-radius:8px}
  .track .done{position:absolute;inset-block:0;inset-inline-start:0;background:var(--brand);border-radius:8px}
  .legend{display:flex;gap:16px;font-size:.82rem;color:var(--muted);margin-top:10px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:.82rem;background:#fafbfc;position:sticky;top:0}
  td.name{text-align:right;font-weight:600}
  tr.clickable{cursor:pointer}
  tr.clickable:hover{background:#f7f8ff}
  .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.82rem;font-weight:700}
  .pill.g{background:var(--okbg);color:var(--ok)}
  .pill.y{background:#fef3c7;color:var(--warn)}
  .pill.r{background:#fee2e2;color:var(--bad)}
  .wrongs{color:var(--bad);font-size:.82rem;direction:ltr;unicode-bidi:plaintext}
  .scroll{max-height:460px;overflow:auto;border-radius:10px;border:1px solid var(--line)}

  .log{list-style:none;margin:0;padding:0}
  .log li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .log .ic{font-size:1.2rem;width:30px;text-align:center}
  .log .txt{flex:1}
  .log .txt b{font-weight:600}
  .log .when{color:var(--muted);font-size:.8rem;white-space:nowrap}

  .empty{text-align:center;color:var(--muted);padding:30px}
  canvas{max-width:100%}

  #gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    padding:20px;background:linear-gradient(135deg,var(--brand),var(--brand2))}
  #gate.off{display:none}
  .gate-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:30px 26px;width:100%;max-width:360px;text-align:center}
  .gate-card .logo{font-size:2.2rem}
  .gate-card h2{margin:10px 0 4px;color:var(--brand)}
  .gate-card p{color:var(--muted);font-size:.92rem;margin:0 0 20px}
  .gate-card input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;
    font-size:1rem;font-family:inherit;text-align:center;margin-bottom:12px}
  .gate-card input:focus{outline:none;border-color:var(--brand)}
  .gate-card button{width:100%;padding:13px;border:0;border-radius:11px;background:var(--brand);
    color:#fff;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
  .gate-card button:disabled{opacity:.6}
  .gate-err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin-top:6px}
  .gate-tabs{display:flex;gap:6px;margin-bottom:16px;background:#eef0f5;border-radius:11px;padding:4px}
  .gate-tabs button{flex:1;padding:9px;border:0;border-radius:8px;background:transparent;
    color:var(--muted);font-weight:600;cursor:pointer;font-family:inherit;font-size:.92rem;width:auto;margin:0}
  .gate-tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  #setup{max-width:1050px;margin:40px auto;padding:22px;display:none}
  code{background:#eef0f5;padding:2px 6px;border-radius:5px;direction:ltr;unicode-bidi:plaintext;display:inline-block;font-size:.88rem}
</style>
</head>
<body>

<div id="gate">
  <form class="gate-card" id="gateForm" onsubmit="return false">
    <div class="logo">🔐</div>
    <h2>لوحة المتابعة</h2>
    <p id="gateSub">أدخل كلمة مرور المدير</p>
    <div class="gate-tabs">
      <button type="button" id="tabAdmin" class="on" onclick="setRole('admin')">مدير الموقع</button>
      <button type="button" id="tabParent" onclick="setRole('parent')">وليّ الأمر</button>
    </div>
    <input id="gateName" type="text" placeholder="اسم الطالب" style="display:none">
    <input id="gatePass" type="password" autocomplete="current-password" placeholder="كلمة مرور المدير">
    <button id="gateBtn" type="submit">دخول</button>
    <div class="gate-err" id="gateErr"></div>
  </form>
</div>

<div id="setup">
  <div class="panel">
    <h2>⚙ لم تُضبط قاعدة البيانات بعد</h2>
    <p>هذه اللوحة تحتاج إلى ملف <code>config.js</code> مملوءاً برابط مشروع Supabase ومفتاح anon.</p>
  </div>
</div>

<div id="dash" style="display:none">
  <header>
    <div>
      <h1>📊 لوحة متابعة الطلاب</h1>
      <div class="sub" id="hsub">منصة مرمر</div>
    </div>
    <div class="actions">
      <button onclick="refresh()">↻ تحديث</button>
      <button onclick="logout()">خروج</button>
    </div>
  </header>
  <main>
    <div class="pickbar" id="pickbar">
      <label for="pick">الطالب:</label>
      <select id="pick" onchange="selectStudent(this.value)"></select>
    </div>
    <div id="body"><div class="empty">…جارٍ التحميل</div></div>
  </main>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
// مواد كلّ منهاج وإجمالي دروسه (حدّثه عند إضافة محتوى منهاج جديد)
const SUBJECTS_T2 = [
  {name:"الفيزياء", icon:"⚛", total:13},
  {name:"الكيمياء", icon:"⚗", total:14},
  {name:"علم الأحياء والأرض", icon:"🧬", total:26},
  {name:"الرياضيات (الجزء الأول)", icon:"∫", total:25},
  {name:"الرياضيات (الجزء الثاني)", icon:"△", total:21},
  {name:"اللغة العربية وآدابها", icon:"📖", total:44},
  {name:"اللغة الإنكليزية", icon:"🌐", total:7}
];
const CURRICULA_META = {
  "thanawi2-sci": {short:"الثاني الثانوي العلميّ", subjects:SUBJECTS_T2, total:SUBJECTS_T2.reduce((a,s)=>a+s.total,0)},
  "i3":           {short:"التاسع",                 subjects:[{name:"الجبر", icon:"➗", total:19},{name:"الهندسة", icon:"📐", total:12},{name:"العلوم", icon:"🔬", total:14},{name:"اللغة العربيّة", icon:"📖", total:14},{name:"الفيزياء والكيمياء", icon:"⚛️", total:18},{name:"اللغة الإنكليزيّة", icon:"📘", total:12}], total:89}
};
const CURR_LABELS = [{id:"thanawi2-sci",label:"الثاني الثانوي العلميّ"},{id:"i3",label:"الثالث الإعداديّ (التاسع)"}];
// مواد السنة السابقة (مطابقة لـ prevExam في بيانات المنهاج) لعرض علامات الطالب
const PREV_META = {
  "thanawi2-sci": { title:"علامات الصف العاشر", subjects:[
    {key:"math",name:"الرياضيات",max:400},{key:"arab",name:"اللغة العربية",max:500},{key:"eng",name:"اللغة الإنكليزية",max:300},
    {key:"phys",name:"الفيزياء",max:200},{key:"chem",name:"الكيمياء",max:200},{key:"bio",name:"علم الأحياء",max:200} ] },
  "i3": { title:"علامات الصف الثامن", subjects:[
    {key:"math",name:"الرياضيات",max:100},{key:"sci",name:"العلوم (أحياء)",max:100},{key:"phch",name:"الفيزياء والكيمياء",max:100},{key:"arab",name:"اللغة العربية",max:100},{key:"eng",name:"اللغة الإنكليزية",max:100} ] }
};
function prevMetaFor(cid){ return PREV_META[cid] || PREV_META["thanawi2-sci"]; }
function metaFor(cid){ return CURRICULA_META[cid] || CURRICULA_META["thanawi2-sci"]; }
function currLabel(cid){ const m=CURR_LABELS.find(c=>c.id===cid); return m?m.label:(cid||"—"); }

const cfg = window.MARMAR_CONFIG;
const configured = cfg && cfg.url && cfg.anonKey
  && !/ضع-هنا/.test(cfg.url) && !/ضع-هنا/.test(cfg.anonKey)
  && typeof window.supabase !== "undefined";
let client = configured ? window.supabase.createClient(cfg.url, cfg.anonKey) : null;
let adminPass = null;
let role = "admin";          // "admin" | "parent"
let parentPass = null, parentCtx = null;   // سياق وليّ الأمر (طالب واحد)
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function setRole(r){
  role = r;
  $("tabAdmin").classList.toggle("on", r==="admin");
  $("tabParent").classList.toggle("on", r==="parent");
  $("gateName").style.display = r==="parent" ? "" : "none";
  $("gatePass").placeholder = r==="parent" ? "كلمة مرور وليّ الأمر" : "كلمة مرور المدير";
  $("gateSub").textContent = r==="parent" ? "ادخل لمتابعة ابنك: اسم الطالب وكلمة مرور وليّ الأمر" : "أدخل كلمة مرور المدير";
  $("gateErr").textContent = "";
}
window.setRole = setRole;

function start(){
  if(!configured){ $("gate").classList.add("off"); $("setup").style.display="block"; return; }
  const saved = sessionStorage.getItem("marmar_admin");
  if(saved){ adminPass = saved; role="admin"; openDash(); return; }
  const ps = sessionStorage.getItem("marmar_parent");
  if(ps){ try{ const o=JSON.parse(ps); parentPass=o.pass; parentCtx=o.ctx; role="parent"; openDash(); }catch(e){} }
}
$("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const p = $("gatePass").value.trim(); if(!p) return;
  $("gateBtn").disabled = true; $("gateErr").textContent = "…";
  if(role==="parent"){
    const nm = $("gateName").value.trim();
    if(!nm){ $("gateErr").textContent="أدخل اسم الطالب"; $("gateBtn").disabled=false; return; }
    const ctx = await tryParent(nm, p);
    if(ctx){ parentPass=p; parentCtx=ctx; sessionStorage.setItem("marmar_parent", JSON.stringify({pass:p,ctx}));
             $("gate").classList.add("off"); openDash(); }
    else { $("gateErr").textContent="اسم الطالب أو كلمة مرور وليّ الأمر غير صحيحة"; $("gateBtn").disabled=false; $("gatePass").select(); }
  } else {
    const ok = await tryPass(p);
    if(ok){ adminPass = p; sessionStorage.setItem("marmar_admin", p);
            $("gate").classList.add("off"); openDash(); }
    else { $("gateErr").textContent = "كلمة المرور غير صحيحة"; $("gateBtn").disabled=false; $("gatePass").select(); }
  }
});
async function tryPass(p){
  try{ const {error} = await client.rpc("get_activity",{p_admin_pass:p}); return !error; }
  catch(e){ return false; }
}
async function tryParent(name, p){
  try{ const {data,error} = await client.rpc("parent_login",{p_name:name,p_parent_pass:p});
    if(error || !data || !data.length) return null; return data[0];
  }catch(e){ return null; }
}
function logout(){ sessionStorage.removeItem("marmar_admin"); sessionStorage.removeItem("marmar_parent"); location.reload(); }
function openDash(){
  $("dash").style.display="block";
  const pb=$("pickbar"); if(pb) pb.style.display = role==="parent" ? "none" : "";
  if(role==="parent"){ $("dash").querySelector("h1").textContent="👪 متابعة ابنك"; loadParent(); }
  else load();
}
function refresh(){ role==="parent" ? loadParent() : load(); }
window.refresh = refresh;

async function loadParent(){
  $("body").innerHTML = '<div class="empty">…جارٍ التحميل</div>';
  try{
    const {data,error} = await client.rpc("get_student_activity",{p_id:parentCtx.id,p_parent_pass:parentPass});
    if(error){ $("body").innerHTML='<div class="empty">تعذّر الجلب — تحقّق من الاتصال.</div>'; return; }
    ALL = (data||[]).map(r=>({...r, detail:r.detail||{}, when:new Date(r.ts)}));
    STUDENTS = [{id:parentCtx.id, name:parentCtx.name, curriculum:parentCtx.curriculum, prev_marks:parentCtx.prev_marks, has_img:parentCtx.has_img, has_parent:true}];
    current = parentCtx.id;
    renderStudent(parentCtx.id);
  }catch(e){ $("body").innerHTML='<div class="empty">تعذّر الاتصال بقاعدة البيانات.</div>'; }
}

/* ---------- تحميل ---------- */
let ALL = [], STUDENTS = [], current = "all", INVITE = "", currFilter = "all";
function setCurrFilter(v){ currFilter=v; if(current==="all") renderRoster(); }
window.setCurrFilter=setCurrFilter;
async function changeCurr(id, v){
  const {error}=await client.rpc("set_curriculum",{p_admin_pass:adminPass,p_id:id,p_curriculum:v});
  if(error){ alert("تعذّر تغيير المنهاج."); return; }
  const st=STUDENTS.find(s=>s.id===id); if(st) st.curriculum=v;
  renderStudent(id);
}
window.changeCurr=changeCurr;
async function load(){
  $("body").innerHTML = '<div class="empty">…جارٍ التحميل</div>';
  try{
    const [a, s, inv] = await Promise.all([
      client.rpc("get_activity",{p_admin_pass:adminPass}),
      client.rpc("get_students",{p_admin_pass:adminPass}),
      client.rpc("get_invite",{p_admin_pass:adminPass})
    ]);
    if(a.error){ $("body").innerHTML='<div class="empty">تعذّر الجلب — تحقّق من الاتصال وكلمة المرور.</div>'; return; }
    ALL = (a.data||[]).map(r=>({...r, detail:r.detail||{}, when:new Date(r.ts)}));
    STUDENTS = (s.data||[]).slice();
    INVITE = inv.error ? "" : (inv.data||"");
    buildPicker();
    draw();
  }catch(e){ $("body").innerHTML='<div class="empty">تعذّر الاتصال بقاعدة البيانات.</div>'; }
}
async function delStudent(id, name){
  if(!window.confirm("حذف الطالب «"+name+"» وكلّ نشاطه نهائياً؟ لا يمكن التراجع.")) return;
  const {error}=await client.rpc("delete_student",{p_admin_pass:adminPass,p_id:id});
  if(error){ alert("تعذّر الحذف."); return; }
  current="all"; await load();
}
window.delStudent=delStudent;
async function changeInvite(){
  const v=($("inviteInput").value||"").trim();
  if(v.length<4){ $("inviteMsg").textContent="الرمز قصير (٤ أحرف على الأقل)"; return; }
  const {error}=await client.rpc("set_invite",{p_admin_pass:adminPass,p_code:v});
  if(error){ $("inviteMsg").textContent="تعذّر التغيير"; return; }
  INVITE=v; $("inviteMsg").textContent="✓ حُفظ رمز الدعوة الجديد";
}
window.changeInvite=changeInvite;
function buildPicker(){
  const sel=$("pick");
  const opts=['<option value="all">كلّ الطلاب (نظرة عامّة)</option>']
    .concat(STUDENTS.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`));
  sel.innerHTML=opts.join("");
  sel.value=current;
}
function selectStudent(v){ current=v; draw(); }
function draw(){
  if(current==="all") renderRoster();
  else renderStudent(Number(current));
}

/* ---------- أدوات الوقت ---------- */
const AR=n=>String(n);
function dayKey(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function dayLabel(d){ return d.getDate()+"/"+(d.getMonth()+1); }
function relTime(d){
  if(!d) return "—";
  const s=(Date.now()-d.getTime())/1000;
  if(s<60) return "الآن";
  if(s<3600) return "قبل "+AR(Math.floor(s/60))+" دقيقة";
  if(s<86400){ const h=Math.floor(s/3600); return "قبل "+AR(h)+(h===1?" ساعة":h===2?" ساعتين":" ساعات"); }
  const days=Math.floor(s/86400);
  if(days===1) return "أمس";
  if(days<30) return "قبل "+AR(days)+" يوماً";
  return d.toLocaleDateString("ar");
}
function stat(k,v){ return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`; }
function fmtDur(min){
  if(!min) return `<span class="num">0</span> <small>دقيقة</small>`;
  if(min<60) return `<span class="num">${min}</span> <small>دقيقة</small>`;
  const h=Math.floor(min/60), m=min%60;
  return `<span class="num">${h}</span> <small>ساعة</small>`+(m?` <span class="num">${m}</span> <small>د</small>`:"");
}
function pill(p){ if(p==null) return "—"; const c=p>=90?"g":p>=60?"y":"r"; return `<span class="pill ${c} num">${p}٪</span>`; }

/* ---------- حساب مقاييس طالب من صفوفه ---------- */
function statsFor(rows){
  const quizzes=rows.filter(r=>r.kind==="quiz");
  const exams=rows.filter(r=>r.kind==="exam");
  const opened=new Set(rows.filter(r=>r.kind==="open").map(r=>r.lesson_id).filter(Boolean));
  const doneState={}; rows.filter(r=>r.kind==="done").slice().reverse().forEach(r=>{doneState[r.lesson_id]=!!r.detail.done;});
  const done=new Set(Object.keys(doneState).filter(k=>doneState[k]));
  const cards=new Set(rows.filter(r=>r.kind==="card").map(r=>r.lesson_id+"#"+r.detail.index));
  const lastPct={}; quizzes.slice().reverse().forEach(r=>{ if(typeof r.detail.pct==="number") lastPct[r.lesson_id]=r.detail.pct; });
  const pcts=Object.values(lastPct);
  const avg=pcts.length?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):null;
  const buckets={}; rows.forEach(r=>{const k=dayKey(r.when);(buckets[k]=buckets[k]||new Set()).add(Math.floor(r.when.getTime()/120000));});
  let min=0; Object.values(buckets).forEach(s=>min+=s.size*2);
  const last=rows.length?rows.reduce((a,b)=>b.when>a?b.when:a,rows[0].when):null;
  return {quizzes, exams, opened, done, cards, avg, min, last, buckets};
}

/* ---------- نظرة عامّة: كلّ الطلاب ---------- */
function renderRoster(){
  $("hsub").textContent = "نظرة عامّة على الصفّ";
  const now=Date.now();
  let totalQuiz=0, classPcts=[], activeToday=0, activeWeek=0;
  const perStudent = STUDENTS.map(st=>{
    const rows=ALL.filter(r=>r.student_id===st.id);
    const s=statsFor(rows);
    totalQuiz+=s.quizzes.length;
    if(s.avg!=null) classPcts.push(s.avg);
    if(s.last && (now-s.last.getTime())<86400e3) activeToday++;
    if(s.last && (now-s.last.getTime())<7*86400e3) activeWeek++;
    return {st, s};
  });
  const classAvg = classPcts.length?Math.round(classPcts.reduce((a,b)=>a+b,0)/classPcts.length):null;

  let h='<div class="stats">';
  h+=stat("عدد الطلاب", `<span class="num">${STUDENTS.length}</span>`);
  h+=stat("نشِطون اليوم", `<span class="num">${activeToday}</span>`);
  h+=stat("نشِطون هذا الأسبوع", `<span class="num">${activeWeek}</span>`);
  h+=stat("إجمالي الاختبارات", `<span class="num">${totalQuiz}</span>`);
  h+=stat("متوسّط الصفّ", classAvg==null?"—":`<span class="num">${classAvg}٪</span>`);
  h+='</div>';

  if(!STUDENTS.length){
    h+='<div class="panel"><div class="empty">لا يوجد طلاب بعد.<br>سيظهر الطلاب هنا فور تسجيلهم عبر رمز الدعوة.</div></div>';
    $("body").innerHTML=h; return;
  }

  // لوحة رمز الدعوة
  h+=`<div class="panel"><h2>🔑 رمز الدعوة</h2>
    <p style="color:var(--muted);font-size:.9rem;margin:0 0 12px">الطلاب الجدد يحتاجون هذا الرمز لإنشاء حساب. غيّره إذا تسرّب لمن لا علاقة له (لن يستطيع أحد التسجيل بالرمز القديم بعدها).</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input id="inviteInput" value="${esc(INVITE)}" style="flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;direction:ltr;unicode-bidi:plaintext">
      <button onclick="changeInvite()" style="padding:10px 18px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;font-family:inherit">حفظ الرمز</button>
    </div>
    <div id="inviteMsg" style="color:var(--ok);font-size:.88rem;margin-top:8px;min-height:1.1em"></div></div>`;

  // ترتيب حسب آخر نشاط + فلترة حسب المنهاج
  perStudent.sort((a,b)=>(b.s.last?b.s.last:0)-(a.s.last?a.s.last:0));
  const shown = currFilter==="all" ? perStudent : perStudent.filter(x=>(x.st.curriculum||"thanawi2-sci")===currFilter);
  const currOpts = ['<option value="all">كلّ المناهج</option>']
    .concat(CURR_LABELS.map(c=>`<option value="${c.id}" ${currFilter===c.id?"selected":""}>${c.label}</option>`)).join("");
  h+=`<div class="panel"><h2>👥 الطلاب</h2>
    <div style="margin-bottom:12px"><label style="color:var(--muted);font-size:.9rem">تصفية حسب المنهاج: </label>
      <select onchange="setCurrFilter(this.value)" style="padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit">${currOpts}</select></div>
    <div class="scroll"><table><thead><tr>`
   +'<th>الطالب</th><th>المنهاج</th><th>آخر نشاط</th><th>دروس فُتحت</th><th>أُنجزت</th><th>اختبارات</th><th>متوسّط</th><th>وقت الدراسة</th><th></th>'
   +'</tr></thead><tbody>';
  shown.forEach(({st,s})=>{
    const tot=metaFor(st.curriculum).total;
    h+=`<tr class="clickable" onclick="pickAndShow(${st.id})">
      <td class="name">${esc(st.name)}</td>
      <td><small>${esc(metaFor(st.curriculum).short)}</small></td>
      <td>${relTime(s.last)}</td>
      <td><span class="num">${s.opened.size}</span> <small style="color:var(--muted)">/${tot}</small></td>
      <td><span class="num">${s.done.size}</span></td>
      <td><span class="num">${s.quizzes.length}</span></td>
      <td>${pill(s.avg)}</td>
      <td>${fmtDur(s.min)}</td>
      <td><button title="حذف الطالب" onclick="event.stopPropagation();delStudent(${st.id},'${esc(st.name).replace(/'/g,"\\'")}')" style="border:0;background:#fee2e2;color:var(--bad);border-radius:8px;padding:6px 10px;cursor:pointer;font-family:inherit;font-size:.85rem">🗑 حذف</button></td>
    </tr>`;
  });
  h+='</tbody></table></div><div class="legend" style="margin-top:12px">اضغط على اسم الطالب لعرض تفاصيله · زرّ الحذف لإزالة من لا علاقة له.</div></div>';
  $("body").innerHTML=h;
}
function pickAndShow(id){ current=String(id); $("pick").value=current; renderStudent(id); }

/* ---------- تفاصيل طالب واحد ---------- */
const _subjCache={};
function subjOf(rows,id){
  if(_subjCache[id]!==undefined) return _subjCache[id];
  const r=rows.find(r=>r.lesson_id===id && (r.subject||r.detail.subject));
  return _subjCache[id]=r?(r.subject||r.detail.subject):null;
}
function renderStudent(id){
  const st=STUDENTS.find(s=>s.id===id);
  const name=st?st.name:"طالب";
  const cid=st?(st.curriculum||"thanawi2-sci"):"thanawi2-sci";
  const meta=metaFor(cid);
  $("hsub").textContent="الطالب: "+name+" · "+meta.short;
  const rows=ALL.filter(r=>r.student_id===id);
  const isAdmin = role==="admin";
  const currSel = isAdmin ? `<span style="color:var(--muted);font-size:.85rem">المنهاج:</span>
    <select onchange="changeCurr(${id},this.value)" style="padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:.85rem">
      ${CURR_LABELS.map(c=>`<option value="${c.id}" ${c.id===cid?"selected":""}>${c.label}</option>`).join("")}</select>` : "";
  const topbar = isAdmin
    ? `<div style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <span class="backlink" onclick="pickAll()">← كلّ الطلاب</span><span style="display:flex;gap:8px;align-items:center">${currSel}</span></div>`
    : `<div style="margin-bottom:14px;color:var(--muted);font-size:.9rem">👋 متابعة ابنك — عرضٌ للاطّلاع فقط.</div>`;
  const prevPanel = buildPrevPanel(st, cid);
  if(!rows.length){ $("body").innerHTML=`<div class="panel">${topbar}<div class="empty">لا يوجد نشاط لـ ${esc(name)} بعد.</div></div>`+prevPanel+(isAdmin?buildParentAccess(st):""); return; }
  const s=statsFor(rows);

  let h=topbar;
  h+='<div class="stats">';
  h+=stat("آخر نشاط", relTime(s.last));
  h+=stat("أيام نشطة", `<span class="num">${Object.keys(s.buckets).length}</span>`);
  h+=stat("وقت الدراسة التقريبي", fmtDur(s.min));
  h+=stat("دروس فُتحت", `<span class="num">${s.opened.size}</span> <small>/ ${meta.total}</small>`);
  h+=stat("دروس أُنجزت", `<span class="num">${s.done.size}</span> <small>/ ${meta.total}</small>`);
  h+=stat("اختبارات", `<span class="num">${s.quizzes.length}</span>`);
  h+=stat("اختبارات فصليّة", `<span class="num">${s.exams.length}</span>`);
  h+=stat("متوسّط العلامات", s.avg==null?"—":`<span class="num">${s.avg}٪</span>`);
  h+=stat("بطاقات روجعت", `<span class="num">${s.cards.size}</span>`);
  h+='</div>';

  h+='<div class="panel"><h2>⏱ وقت الدراسة اليوميّ (آخر ١٤ يوماً)</h2><canvas id="timeChart" height="110"></canvas></div>';

  h+= meta.subjects.length ? '<div class="panel"><h2>📚 التقدّم حسب المادة</h2>' : '';
  (meta.subjects||[]).forEach(sub=>{
    const o=[...s.opened].filter(id=>subjOf(rows,id)===sub.name).length;
    const d=[...s.done].filter(id=>subjOf(rows,id)===sub.name).length;
    const op=Math.round(o/sub.total*100), dp=Math.round(d/sub.total*100);
    h+=`<div class="subj"><div class="row"><span class="lbl">${sub.icon} ${esc(sub.name)}</span>
      <span class="val">فُتح <span class="num">${o}</span> · أُنجز <span class="num">${d}</span> · من <span class="num">${sub.total}</span></span></div>
      <div class="track"><div class="open" style="width:${op}%"></div><div class="done" style="width:${dp}%"></div></div></div>`;
  });
  if(meta.subjects.length) h+='<div class="legend"><span><i class="dot" style="background:#c7d2fe"></i> فُتح الدرس</span>'
   +'<span><i class="dot" style="background:var(--brand)"></i> وُسم كمُنجَز</span></div></div>';

  h+=prevPanel;
  if(isAdmin) h+=buildParentAccess(st);
  h+=buildExamTable(s.exams);
  h+=buildQuizTable(s.quizzes, rows);
  h+=buildLog(rows.slice(0,45));

  $("body").innerHTML=h;
  drawTimeChart(s.buckets);
}

/* لوحة نتائج السنة السابقة (علامات + صورة عند الطلب) */
function pPct(v,m){ return m? v/m*100 : 0; }
function pColor(p){ return p>=85?"#16a34a":p>=70?"#65a30d":p>=60?"#d97706":"#dc2626"; }
function buildPrevPanel(st, cid){
  if(!st) return "";
  const pm = st.prev_marks || null;
  const pe = prevMetaFor(cid);
  if(!pm || !Object.keys(pm).length){
    return `<div class="panel"><h2>📑 نتائج السنة السابقة</h2>
      <div class="empty">لم يُدخل الطالب علاماته بعد.${ st.has_img?` <span style="color:var(--muted)">(توجد صورة مرفقة)</span>`:"" }</div>
      ${ st.has_img?`<div style="text-align:center;margin-top:8px"><button class="btn" onclick="loadPrevImg(${st.id})">عرض الصورة المرفقة</button></div><div id="prevImg_${st.id}" style="margin-top:10px"></div>`:"" }</div>`;
  }
  const rows = pe.subjects.filter(s=>pm[s.key]!=null).map(s=>{const v=+pm[s.key];const p=pPct(v,s.max);return{...s,v,p,lost:s.max-v};});
  const totMax=rows.reduce((a,r)=>a+r.max,0), totV=rows.reduce((a,r)=>a+r.v,0);
  const overall=totMax?totV/totMax*100:0;
  let h=`<div class="panel"><h2>📑 نتائج السنة السابقة — ${pe.title}</h2>
    <div style="margin-bottom:10px">المعدّل العامّ: <strong style="color:${pColor(overall)}">${overall.toFixed(1)}٪</strong>
      <span style="color:var(--muted)">(${totV} / ${totMax})</span></div>
    <div class="scroll"><table><thead><tr><th>المادة</th><th>العلامة</th><th>النسبة</th><th>المهدور</th></tr></thead><tbody>`;
  rows.sort((a,b)=>b.lost-a.lost).forEach(r=>{
    h+=`<tr><td>${esc(r.name)}</td><td><span class="num">${r.v}</span> / ${r.max}</td>
      <td style="color:${pColor(r.p)};font-weight:600">${r.p.toFixed(1)}٪</td><td><span class="num">${r.lost}</span></td></tr>`;
  });
  h+=`</tbody></table></div>`;
  if(st.has_img){ h+=`<div style="text-align:center;margin-top:12px"><button class="btn" onclick="loadPrevImg(${st.id})">عرض صورة النتائج المرفقة</button></div><div id="prevImg_${st.id}" style="margin-top:10px"></div>`; }
  h+=`</div>`;
  return h;
}
async function loadPrevImg(id){
  const box=$("prevImg_"+id); if(!box) return;
  box.innerHTML=`<div style="color:var(--muted)">…جارٍ التحميل</div>`;
  try{
    const {data,error} = role==="parent"
      ? await client.rpc("get_student_img",{p_id:id,p_parent_pass:parentPass})
      : await client.rpc("get_prev_img",{p_admin_pass:adminPass,p_id:id});
    if(error||!data){ box.innerHTML=`<div class="empty">تعذّر تحميل الصورة.</div>`; return; }
    box.innerHTML=`<img src="${data}" style="max-width:100%;border:1px solid var(--line);border-radius:8px">`;
  }catch(e){ box.innerHTML=`<div class="empty">تعذّر الاتصال.</div>`; }
}
window.loadPrevImg = loadPrevImg;

/* لوحة إدارة كلمة مرور وليّ الأمر (للمدير فقط) */
function buildParentAccess(st){
  if(!st) return "";
  const has = st.has_parent;
  return `<div class="panel"><h2>👪 دخول وليّ الأمر</h2>
    <p style="color:var(--muted);font-size:.9rem;margin:0 0 10px">
      ${ has ? "لهذا الطالب كلمة مرور وليّ أمر مفعّلة. يدخل الوليّ من تبويب «وليّ الأمر» باسم الطالب وهذه الكلمة."
             : "لا توجد كلمة مرور وليّ أمر لهذا الطالب بعد." }
      يمكنك ضبطها أو تغييرها هنا:</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="ppw_${st.id}" type="text" placeholder="كلمة مرور وليّ الأمر الجديدة" style="flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;direction:ltr;unicode-bidi:plaintext">
      <button onclick="setParentPass(${st.id})" style="padding:9px 16px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;font-family:inherit">حفظ</button>
    </div>
    <div id="ppwMsg_${st.id}" style="font-size:.85rem;margin-top:8px;min-height:1.1em"></div></div>`;
}
async function setParentPass(id){
  const v=$("ppw_"+id).value.trim(); const msg=$("ppwMsg_"+id);
  if(v.length<4){ msg.style.color="var(--bad)"; msg.textContent="الكلمة قصيرة (٤ أحرف على الأقلّ)"; return; }
  msg.style.color="var(--muted)"; msg.textContent="…جارٍ الحفظ";
  try{
    const {error}=await client.rpc("set_parent_pass",{p_admin_pass:adminPass,p_id:id,p_pass:v});
    if(error){ msg.style.color="var(--bad)"; msg.textContent="تعذّر الحفظ."; return; }
    const st=STUDENTS.find(s=>s.id===id); if(st) st.has_parent=true;
    msg.style.color="#16a34a"; msg.textContent="✓ حُفظت كلمة مرور وليّ الأمر."; $("ppw_"+id).value="";
  }catch(e){ msg.style.color="var(--bad)"; msg.textContent="تعذّر الاتصال."; }
}
window.setParentPass = setParentPass;
function pickAll(){ current="all"; $("pick").value="all"; renderRoster(); }

function buildExamTable(exams){
  if(!exams.length) return "";
  const list=exams.slice().sort((a,b)=>b.when-a.when);
  let h='<div class="panel"><h2>📝 الاختبارات الفصليّة</h2><div class="scroll"><table><thead><tr>'
   +'<th>المادة</th><th>العلامة</th><th>عدد الأسئلة</th><th>الدروس المشمولة</th><th>الأسئلة المُخطئة</th><th>التاريخ</th></tr></thead><tbody>';
  list.forEach(r=>{
    const d=r.detail||{};
    const wt=(d.wrong&&d.wrong.length)?`<span class="wrongs">س${d.wrong.join("، س")}</span>`:"—";
    h+=`<tr><td>${esc(r.subject||d.subject||"—")}</td><td>${pill(d.pct)}</td>
      <td><span class="num">${d.total||d.count||"—"}</span></td>
      <td><span class="num">${(d.lessons&&d.lessons.length)||"—"}</span></td>
      <td>${wt}</td><td>${relTime(r.when)}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  return h;
}
function buildQuizTable(quizzes, rows){
  if(!quizzes.length) return '<div class="panel"><h2>✍ نتائج الاختبارات</h2><div class="empty">لم يُجرِ أيّ اختبار بعد.</div></div>';
  const byLesson={};
  quizzes.forEach(r=>{
    const id=r.lesson_id; if(!byLesson[id]) byLesson[id]={name:r.lesson_name,subj:r.subject||r.detail.subject,attempts:0,best:0,last:null,lastTs:null,wrong:{}};
    const L=byLesson[id]; L.attempts++;
    const pct=r.detail.pct||0; if(pct>L.best) L.best=pct;
    if(!L.lastTs||r.when>L.lastTs){L.lastTs=r.when;L.last=pct;}
    (r.detail.wrong||[]).forEach(q=>L.wrong[q]=(L.wrong[q]||0)+1);
  });
  const list=Object.values(byLesson).sort((a,b)=>b.lastTs-a.lastTs);
  let h='<div class="panel"><h2>✍ نتائج الاختبارات</h2><div class="scroll"><table><thead><tr>'
   +'<th>المادة</th><th>الدرس</th><th>محاولات</th><th>أفضل</th><th>آخر علامة</th><th>آخر محاولة</th><th>أسئلة متكرّرة الخطأ</th></tr></thead><tbody>';
  list.forEach(L=>{
    const wt=Object.entries(L.wrong).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([q,c])=>`س${q}${c>1?`(×${c})`:""}`).join("، ");
    h+=`<tr><td>${esc(L.subj||"—")}</td><td class="name">${esc(L.name||"")}</td>
      <td><span class="num">${L.attempts}</span></td><td>${pill(L.best)}</td><td>${pill(L.last)}</td>
      <td>${relTime(L.lastTs)}</td><td class="wrongs">${wt||"—"}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  return h;
}
const KIND={open:{i:"📘",t:"فتح درس"},quiz:{i:"✍",t:"اختبار"},exam:{i:"📝",t:"اختبار فصليّ"},card:{i:"🎴",t:"راجع بطاقة"},done:{i:"✓",t:"وسم كمُنجَز"},ping:{i:"•",t:"نشاط"}};
function buildLog(rows){
  rows=rows.filter(r=>r.kind!=="ping");
  if(!rows.length) return "";
  let h='<div class="panel"><h2>🕑 سجلّ النشاط الأخير</h2><ul class="log">';
  rows.slice(0,40).forEach(r=>{
    const k=KIND[r.kind]||{i:"•",t:r.kind};
    let ex=""; if(r.kind==="quiz"&&typeof r.detail.pct==="number") ex=` — ${pill(r.detail.pct)}`;
    if(r.kind==="done") ex=r.detail.done?" ✓":" (أُلغي)";
    h+=`<li><span class="ic">${k.i}</span><span class="txt">${k.t}${r.lesson_name?`: <b>${esc(r.lesson_name)}</b>`:""}
      ${r.subject?`<span style="color:var(--muted);font-size:.82rem"> · ${esc(r.subject)}</span>`:""}${ex}</span>
      <span class="when">${relTime(r.when)}</span></li>`;
  });
  h+='</ul></div>'; return h;
}
let _chart=null;
function drawTimeChart(buckets){
  const el=$("timeChart"); if(!el||typeof Chart==="undefined") return;
  const days=[]; const now=new Date();
  for(let i=13;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); days.push(d); }
  const labels=days.map(dayLabel);
  const vals=days.map(d=>{ const s=buckets[dayKey(d)]; return s?s.size*2:0; });
  if(_chart) _chart.destroy();
  _chart=new Chart(el,{type:"bar",
    data:{labels,datasets:[{data:vals,backgroundColor:"#7c3aed",borderRadius:6,label:"دقائق"}]},
    options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y+" دقيقة"}}},
      scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
}

window.selectStudent=selectStudent; window.pickAndShow=pickAndShow; window.pickAll=pickAll;
window.load=load; window.logout=logout;
start();
</script>
</body>
</html>
